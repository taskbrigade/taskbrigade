{# Model location of an agent (`app/services/zones.py`); `current` = the stored or submitted value. #}
<label>{{ _("Model location") }}
  <select name="model_location">{% for value, label in model_locations.items() %}{% if value != "none" or current == "none" %}<option value="{{ value }}" {% if value == current %}selected{% endif %}>{{ _(label) }}</option>{% endif %}{% endfor %}</select>
  <small>{{ _("Where the agent's model runs, i.e. where content goes. Only agents with a local model (and local runtime) may work on local_only projects. Claude Code and Codex always use a cloud model.") }}</small>
</label>
<label><input type="checkbox" name="confirm_local_model" value="1"> {{ _("I have checked that this agent uses no cloud model") }}
  <small class="field-help">{{ _("Required when switching to “local model”.") }}</small></label>
