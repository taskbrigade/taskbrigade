<!doctype html>
<html lang="{{ current_language() }}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"422","swap":true},{"code":"[45]..","swap":false,"error":true}]}'>
  <title>{% block title %}TaskBrigade{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/brand/favicon.svg?v={{ static_v }}">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png?v={{ static_v }}">
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png?v={{ static_v }}">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="stylesheet" href="/static/vendor/pico.min.css">
  <link rel="stylesheet" href="/static/app.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/ui.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/header.css?v={{ static_v }}">
  <script>document.documentElement.classList.add("js")</script>
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script type="application/json" id="tm-i18n">{{ js_messages() | tojson }}</script>
  <script src="/static/i18n.js?v={{ static_v }}" defer></script>
  <script src="/static/form_guard.js?v={{ static_v }}" defer></script>
  <script src="/static/model_fields.js?v={{ static_v }}" defer></script>
  <script src="/static/shell.js?v={{ static_v }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body{% block body_attrs %}{% endblock %}{% if user %} hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'{% endif %}>
  {% include "_app_header.html" %}
  <main class="app-main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
