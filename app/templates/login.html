{% extends "base.html" %}
{% block title %}{{ _("Log in") }} – TaskBrigade{% endblock %}
{% block content %}
<div class="ui-page ui-auth">
  <section class="ui-card ui-auth-card" aria-labelledby="login-title">
    <h2 class="ui-page-title" id="login-title">{{ _("Log in") }}</h2>
    {% if error %}<p class="banner error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="ui-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <label class="ui-field">{{ _("Username") }} <input class="ui-input" name="username" autocomplete="username" required value="{{ username or '' }}"></label>
      <label class="ui-field">{{ _("Password") }} <input class="ui-input" type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit" class="ui-btn">{{ _("Log in") }}</button>
    </form>
    <p class="ui-muted ui-auth-note">{{ _("Behind <code>tailscale serve</code> you are logged in automatically.") }}</p>
  </section>
</div>
{% endblock %}
