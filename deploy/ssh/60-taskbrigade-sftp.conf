# TaskBrigade native SFTP inbox (research/konzept-datenzonen.md §4).
#
# Drop-in for OpenSSH: deliverers in the group tbr-sftp reach only their own chroot below
# /srv/taskbrigade-sftp/<user>. No shell, no port forwarding, no X11, keys only. The group is created by
# `deploy/install.sh`/`deploy/update.sh` when TBR_DATA_SFTP=1; the per-user chroot, the `upload` folder and
# `authorized_keys` are managed by `tbr-admin data sftp-user`.
#
# Enable: install this file as /etc/ssh/sshd_config.d/60-taskbrigade-sftp.conf and reload sshd. The installer
# runs `sshd -t` first and only reloads when the check passes. Remove the file and reload to switch the inbox off.

Match Group tbr-sftp
    ChrootDirectory /srv/taskbrigade-sftp/%u
    ForceCommand internal-sftp -u 0027
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthenticationMethods publickey
    # No sftp subsystem override: the default internal-sftp is used (see `Subsystem sftp` in sshd_config).
